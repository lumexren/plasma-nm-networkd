name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_filename: ${{ steps.package.outputs.release_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          VERSION=$(grep -oP '^pkgver=\K[0-9]+\.[0-9]+\.[0-9]+' PKGBUILD)
          if [ -z "$VERSION" ]; then
            echo "Error: Version not found in PKGBUILD"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          EMAIL: ${{ secrets.EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "lumexren"
          git config user.email "${EMAIL:-lumexren@users.noreply.github.com}"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Generate Changelog
        run: |
          bash .github/scripts/generate-changelog.sh \
            --mode stable \
            --version "${{ steps.version.outputs.version }}" \
            --output release_notes.md

      - name: Package Release Tarball
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_FILENAME="${{ github.event.repository.name }}-v${VERSION}.tar.gz"
          tar --exclude-vcs \
              --exclude="*.pkg.tar.zst" \
              --exclude="pkg" \
              --exclude="kcm/*.so" \
              --exclude="kcm/*.desktop" \
              --exclude="kcm/moc_*" \
              --exclude="kcm/qrc_*" \
              -czvf "$RELEASE_FILENAME" .
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.release_filename }}
            release_notes.md

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          body_path: release_notes.md
          prerelease: false
          files: |
            ${{ needs.build.outputs.release_filename }}

      - name: Update AUR Package
        uses: docker://archlinux:latest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_FILENAME: ${{ needs.build.outputs.release_filename }}
          REPO_URL: "https://github.com/${{ github.repository }}"
          AUR_REPO: "plasma-nm-networkd"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          entrypoint: bash
          args: .github/scripts/aur-release.sh
