name: Staging Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [codeberg-medium]
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_filename: ${{ steps.package.outputs.release_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '^pkgver=\K[0-9]+\.[0-9]+\.[0-9]+' PKGBUILD)
          if [ -z "$BASE_VERSION" ]; then
            echo "Error: Base version not found in PKGBUILD"
            exit 1
          fi

          LAST_STABLE_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' --exclude='pre-*' --exclude='staging-*' HEAD 2>/dev/null || echo "")

          if [ -n "$LAST_STABLE_TAG" ]; then
            COMMITS=$(git rev-list --count "${LAST_STABLE_TAG}"..HEAD)
          else
            COMMITS=$(git rev-list --count HEAD)
          fi

          VERSION="${BASE_VERSION}-staging.${COMMITS}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          EMAIL: ${{ secrets.EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "lumexren"
          git config user.email "${EMAIL}"
          git remote set-url origin "https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git"

          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Generate Changelog
        run: |
          bash .forgejo/scripts/generate-changelog.sh \
            --mode staging \
            --version "${{ steps.version.outputs.version }}" \
            --output release_notes.md

      - name: Package Release Tarball
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_FILENAME="${{ github.event.repository.name }}-v${VERSION}.tar.gz"
          tar --exclude-vcs \
              --exclude="*.pkg.tar.zst" \
              --exclude="pkg" \
              --exclude="kcm/*.so" \
              --exclude="kcm/*.desktop" \
              --exclude="kcm/moc_*" \
              --exclude="kcm/qrc_*" \
              -czvf "$RELEASE_FILENAME" .
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: staging-assets
          path: |
            ${{ steps.package.outputs.release_filename }}
            release_notes.md

  publish:
    runs-on: [codeberg-medium]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: staging-assets

      - name: Create Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          body_path: release_notes.md
          prerelease: true
          md5sum: true
          files: |
            ${{ needs.build.outputs.release_filename }}
