name: ⭐ Feature Request
description: Suggest a new feature or improvement for plasma-nm-networkd
title: "[Feature] "
labels: ["Enhancement", "Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide context and details below:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve or why would this feature be useful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Implementation
      description: Describe your proposed solution or how you envision it working
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you have considered
    validations:
      required: false
